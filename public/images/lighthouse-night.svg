<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t5">
  <title id="t5">Samotna latarnia morska na skalistym cyplu, emitująca snop światła w nocy</title>
  <defs>
